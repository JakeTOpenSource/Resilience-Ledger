# The gates, run on every push from a fresh checkout — so "green on my machine"
# can never be mistaken for green. This workflow is a convenience mirror, not the
# floor: the floor stays `node tracer-corpus.js` on any machine, no packages,
# and must keep working if GitHub Actions never runs again.
# Registered as ci-gates-workflow-corpus-bench-register-pin-self in proposals.json.
name: gates
on:
  push:
  pull_request:

# This workflow checks repository content only. It creates no releases,
# deployments, comments, statuses, or repository changes.
permissions:
  contents: read

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # The append-only gate compares the proposed history to the PR base.
          # A shallow PR merge checkout does not contain origin/<base>.
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22.17.1'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12.10'
      - name: Calibration corpus (the labels are the floor)
        run: node tracer-corpus.js
      - name: Gap Check corpus (negation guard stays honest)
        run: node gapcheck-corpus.js
      - name: Day-ledger corpus (dual attestation, chain integrity)
        run: node day-ledger-corpus.js
      - name: Benchmark (scale limits stay reproducible)
        run: node tracer-bench.js
      - name: Mend Gate register (validates schema, custody, reasons)
        run: node mend-gate.js list
      - name: MCP manifest pin selftest (offline drift tripwire)
        run: node mcp-manifest-pin.js selftest
      - name: Governance authority freeze (offline records and hashes)
        run: node governance/governance-validate.js
      - name: Governance ledger (append-only, replay, privacy, falsification)
        run: node governance/harnesses/run-all.js
      - name: STP v1.2 public reproduction packet
        env:
          DELTA_ATLAS_PYTHON: python3
        run: |
          npm ci --prefix research/stp-v1.2
          npm test --prefix research/stp-v1.2
