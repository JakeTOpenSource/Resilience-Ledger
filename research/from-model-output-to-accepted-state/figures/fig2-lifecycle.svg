<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 420" width="1180" height="420" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" role="img" aria-labelledby="fig2-title fig2-desc"><title id="fig2-title">The proposed ten-stage lifecycle</title><desc id="fig2-desc">Ten conceptual stages run from proposal through correction. Refusal and unresolved are recorded exits at every stage. Acceptance is the only state-update gate. A correction starts a new governed transition and can change state only after a new acceptance record.</desc><defs><marker id="fig2-ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1D4E89"/></marker><marker id="fig2-arm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5A6474"/></marker></defs><g transform="translate(20,18)"><text x="0" y="22" font-size="21" font-weight="600" fill="#101828">The proposed ten-stage lifecycle</text><text x="0" y="46" font-size="17" fill="#5A6474">Conceptual profile. ACCEPT changes state; CORRECT begins a new transition and cannot bypass acceptance.</text><line x1="0" y1="59" x2="1140" y2="59" stroke="#C9D0DA" stroke-width="1"/></g><rect x="1036" y="78" width="120" height="25" rx="4" fill="#F7EBD7" stroke="#9A5B0B" stroke-width="1"/><text x="1096" y="95" font-size="13" font-weight="700" text-anchor="middle" fill="#9A5B0B">PROPOSED</text><rect x="24.0" y="120" width="104" height="60" rx="5" fill="#E3ECF6" stroke="#1D4E89" stroke-width="1.2"/><text x="76.0" y="149.0" font-size="13.5" font-weight="600" text-anchor="middle" fill="#101828">PROPOSE</text><text x="76.0" y="165.0" font-size="13.5" text-anchor="middle" fill="#5A6474">stage 1</text><path d="M128.0,150.0 L137.6,150.0" stroke="#1D4E89" stroke-width="1.3" marker-end="url(#fig2-ar)" fill="none"/><path d="M76.0,180 L76.0,214" stroke="#C9D0DA" stroke-width="1" stroke-dasharray="3 3" fill="none"/><rect x="139.6" y="120" width="104" height="60" rx="5" fill="#E3ECF6" stroke="#1D4E89" stroke-width="1.2"/><text x="191.6" y="149.0" font-size="13.5" font-weight="600" text-anchor="middle" fill="#101828">NORMALIZE</text><text x="191.6" y="165.0" font-size="13.5" text-anchor="middle" fill="#5A6474">stage 2</text><path d="M243.6,150.0 L253.2,150.0" stroke="#1D4E89" stroke-width="1.3" marker-end="url(#fig2-ar)" fill="none"/><path d="M191.6,180 L191.6,214" stroke="#C9D0DA" stroke-width="1" stroke-dasharray="3 3" fill="none"/><rect x="255.2" y="120" width="104" height="60" rx="5" fill="#E3ECF6" stroke="#1D4E89" stroke-width="1.2"/><text x="307.2" y="149.0" font-size="13.5" font-weight="600" text-anchor="middle" fill="#101828">CHECK</text><text x="307.2" y="165.0" font-size="13.5" text-anchor="middle" fill="#5A6474">stage 3</text><path d="M359.2,150.0 L368.79999999999995,150.0" stroke="#1D4E89" stroke-width="1.3" marker-end="url(#fig2-ar)" fill="none"/><path d="M307.2,180 L307.2,214" stroke="#C9D0DA" stroke-width="1" stroke-dasharray="3 3" fill="none"/><rect x="370.79999999999995" y="120" width="104" height="60" rx="5" fill="#E3ECF6" stroke="#1D4E89" stroke-width="1.2"/><text x="422.79999999999995" y="149.0" font-size="13.5" font-weight="600" text-anchor="middle" fill="#101828">AUTHORIZE</text><text x="422.79999999999995" y="165.0" font-size="13.5" text-anchor="middle" fill="#5A6474">stage 4</text><path d="M474.79999999999995,150.0 L484.4,150.0" stroke="#1D4E89" stroke-width="1.3" marker-end="url(#fig2-ar)" fill="none"/><path d="M422.79999999999995,180 L422.79999999999995,214" stroke="#C9D0DA" stroke-width="1" stroke-dasharray="3 3" fill="none"/><rect x="486.4" y="120" width="104" height="60" rx="5" fill="#E3ECF6" stroke="#1D4E89" stroke-width="1.2"/><text x="538.4" y="149.0" font-size="13.5" font-weight="600" text-anchor="middle" fill="#101828">PREPARE</text><text x="538.4" y="165.0" font-size="13.5" text-anchor="middle" fill="#5A6474">stage 5</text><path d="M590.4,150.0 L600.0,150.0" stroke="#1D4E89" stroke-width="1.3" marker-end="url(#fig2-ar)" fill="none"/><path d="M538.4,180 L538.4,214" stroke="#C9D0DA" stroke-width="1" stroke-dasharray="3 3" fill="none"/><rect x="602.0" y="120" width="104" height="60" rx="5" fill="#E3ECF6" stroke="#1D4E89" stroke-width="1.2"/><text x="654.0" y="149.0" font-size="13.5" font-weight="600" text-anchor="middle" fill="#101828">EXECUTE</text><text x="654.0" y="165.0" font-size="13.5" text-anchor="middle" fill="#5A6474">stage 6</text><path d="M706.0,150.0 L715.6,150.0" stroke="#1D4E89" stroke-width="1.3" marker-end="url(#fig2-ar)" fill="none"/><path d="M654.0,180 L654.0,214" stroke="#C9D0DA" stroke-width="1" stroke-dasharray="3 3" fill="none"/><rect x="717.5999999999999" y="120" width="104" height="60" rx="5" fill="#E3ECF6" stroke="#1D4E89" stroke-width="1.2"/><text x="769.5999999999999" y="149.0" font-size="13.5" font-weight="600" text-anchor="middle" fill="#101828">OBSERVE</text><text x="769.5999999999999" y="165.0" font-size="13.5" text-anchor="middle" fill="#5A6474">stage 7</text><path d="M821.5999999999999,150.0 L831.1999999999999,150.0" stroke="#1D4E89" stroke-width="1.3" marker-end="url(#fig2-ar)" fill="none"/><path d="M769.5999999999999,180 L769.5999999999999,214" stroke="#C9D0DA" stroke-width="1" stroke-dasharray="3 3" fill="none"/><rect x="833.1999999999999" y="120" width="104" height="60" rx="5" fill="#E1EFE7" stroke="#2C6E49" stroke-width="1.2"/><text x="885.1999999999999" y="149.0" font-size="13.5" font-weight="600" text-anchor="middle" fill="#101828">ACCEPT</text><text x="885.1999999999999" y="165.0" font-size="13.5" text-anchor="middle" fill="#5A6474">stage 8</text><path d="M937.1999999999999,150.0 L946.8,150.0" stroke="#1D4E89" stroke-width="1.3" marker-end="url(#fig2-ar)" fill="none"/><path d="M885.1999999999999,180 L885.1999999999999,214" stroke="#C9D0DA" stroke-width="1" stroke-dasharray="3 3" fill="none"/><rect x="948.8" y="120" width="104" height="60" rx="5" fill="#E3ECF6" stroke="#1D4E89" stroke-width="1.2"/><text x="1000.8" y="149.0" font-size="13.5" font-weight="600" text-anchor="middle" fill="#101828">OUTCOME</text><text x="1000.8" y="165.0" font-size="13.5" text-anchor="middle" fill="#5A6474">stage 9</text><path d="M1052.8,150.0 L1062.3999999999999,150.0" stroke="#1D4E89" stroke-width="1.3" marker-end="url(#fig2-ar)" fill="none"/><path d="M1000.8,180 L1000.8,214" stroke="#C9D0DA" stroke-width="1" stroke-dasharray="3 3" fill="none"/><rect x="1064.3999999999999" y="120" width="104" height="60" rx="5" fill="#F7EBD7" stroke="#9A5B0B" stroke-width="1.2"/><text x="1116.3999999999999" y="149.0" font-size="13.5" font-weight="600" text-anchor="middle" fill="#101828">CORRECT</text><text x="1116.3999999999999" y="165.0" font-size="13.5" text-anchor="middle" fill="#5A6474">stage 10</text><path d="M1116.3999999999999,180 L1116.3999999999999,214" stroke="#C9D0DA" stroke-width="1" stroke-dasharray="3 3" fill="none"/><text x="885.1999999999999" y="110" font-size="13" text-anchor="middle" fill="#2C6E49" font-weight="600">state-update gate</text><line x1="76.0" y1="214" x2="1116.3999999999999" y2="214" stroke="#5A6474" stroke-width="1.2"/><rect x="150" y="244" width="300" height="62" rx="5" fill="#F7E2DF" stroke="#A32E22" stroke-width="1.2"/><text x="300.0" y="274.0" font-size="15" font-weight="600" text-anchor="middle" fill="#101828">REFUSE</text><text x="300.0" y="290.0" font-size="13.5" text-anchor="middle" fill="#5A6474">a required check is decisively false</text><rect x="560" y="244" width="300" height="62" rx="5" fill="#F7EBD7" stroke="#9A5B0B" stroke-width="1.2"/><text x="710.0" y="274.0" font-size="15" font-weight="600" text-anchor="middle" fill="#101828">UNRESOLVED</text><text x="710.0" y="290.0" font-size="13.5" text-anchor="middle" fill="#5A6474">required evidence is unknown, stale, or errored</text><path d="M300,214 L300,242" stroke="#A32E22" stroke-width="1.4" marker-end="url(#fig2-ar)" fill="none"/><path d="M710,214 L710,242" stroke="#9A5B0B" stroke-width="1.4" marker-end="url(#fig2-ar)" fill="none"/><text x="24" y="338" font-size="14" fill="#5A6474">Both exits are recorded and kept. Neither advances the accepted projection.</text><text x="24" y="361" font-size="14" fill="#5A6474">CORRECT appends a requested supersession and starts a new governed transition.</text><text x="24" y="384" font-size="14" fill="#5A6474">It changes state only after a new ACCEPT record; it never edits the prior record.</text></svg>