<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 430" width="1180" height="430" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" role="img" aria-labelledby="fig4-title fig4-desc"><title id="fig4-title">Six evidence conditions reported separately</title><desc id="fig4-desc">Protocol calibration, consequence, evidence, integrity, privacy, and activity each retain a typed status. No combined score is used.</desc><defs><marker id="fig4-ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1D4E89"/></marker><marker id="fig4-arm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5A6474"/></marker></defs><g transform="translate(20,18)"><text x="0" y="22" font-size="21" font-weight="600" fill="#101828">Six conditions reported separately, rather than averaged into one score</text><text x="0" y="46" font-size="17" fill="#5A6474">A single score would let a strong dimension conceal the one that mattered.</text><line x1="0" y1="59" x2="1140" y2="59" stroke="#C9D0DA" stroke-width="1"/></g><rect x="24" y="98" width="360" height="108" rx="7" fill="#FFFFFF" stroke="#C9D0DA" stroke-width="1.2"/><rect x="24" y="98" width="5" height="108" rx="2.5" fill="#1D4E89"/><text x="46" y="126" font-size="17" font-weight="600" fill="#101828">Protocol calibration</text><text x="46" y="150" font-size="14" fill="#5A6474">Did every required check pass,</text><text x="46" y="168" font-size="14" fill="#5A6474">with nothing unresolved?</text><text x="46" y="195" font-size="13" fill="#5A6474" font-family="Consolas, 'Cascadia Mono', monospace">PASS / FAIL / UNKNOWN / STALE / ERROR / N-A</text><rect x="408" y="98" width="360" height="108" rx="7" fill="#FFFFFF" stroke="#C9D0DA" stroke-width="1.2"/><rect x="408" y="98" width="5" height="108" rx="2.5" fill="#1D4E89"/><text x="430" y="126" font-size="17" font-weight="600" fill="#101828">Consequence</text><text x="430" y="150" font-size="14" fill="#5A6474">Is a named consequence active</text><text x="430" y="168" font-size="14" fill="#5A6474">under the pinned policy?</text><text x="430" y="195" font-size="13" fill="#5A6474" font-family="Consolas, 'Cascadia Mono', monospace">PASS / FAIL / UNKNOWN / STALE / ERROR / N-A</text><rect x="792" y="98" width="360" height="108" rx="7" fill="#FFFFFF" stroke="#C9D0DA" stroke-width="1.2"/><rect x="792" y="98" width="5" height="108" rx="2.5" fill="#1D4E89"/><text x="814" y="126" font-size="17" font-weight="600" fill="#101828">Evidence</text><text x="814" y="150" font-size="14" fill="#5A6474">How much required evidence</text><text x="814" y="168" font-size="14" fill="#5A6474">came back decisive?</text><text x="814" y="195" font-size="13" fill="#5A6474" font-family="Consolas, 'Cascadia Mono', monospace">PASS / FAIL / UNKNOWN / STALE / ERROR / N-A</text><rect x="24" y="224" width="360" height="108" rx="7" fill="#FFFFFF" stroke="#C9D0DA" stroke-width="1.2"/><rect x="24" y="224" width="5" height="108" rx="2.5" fill="#1D4E89"/><text x="46" y="252" font-size="17" font-weight="600" fill="#101828">Integrity</text><text x="46" y="276" font-size="14" fill="#5A6474">Do the recorded bytes still hash</text><text x="46" y="294" font-size="14" fill="#5A6474">to their commitments?</text><text x="46" y="321" font-size="13" fill="#5A6474" font-family="Consolas, 'Cascadia Mono', monospace">PASS / FAIL / UNKNOWN / STALE / ERROR / N-A</text><rect x="408" y="224" width="360" height="108" rx="7" fill="#FFFFFF" stroke="#C9D0DA" stroke-width="1.2"/><rect x="408" y="224" width="5" height="108" rx="2.5" fill="#1D4E89"/><text x="430" y="252" font-size="17" font-weight="600" fill="#101828">Privacy</text><text x="430" y="276" font-size="14" fill="#5A6474">Did anything cross the declared</text><text x="430" y="294" font-size="14" fill="#5A6474">disclosure boundary?</text><text x="430" y="321" font-size="13" fill="#5A6474" font-family="Consolas, 'Cascadia Mono', monospace">PASS / FAIL / UNKNOWN / STALE / ERROR / N-A</text><rect x="792" y="224" width="360" height="108" rx="7" fill="#FFFFFF" stroke="#C9D0DA" stroke-width="1.2"/><rect x="792" y="224" width="5" height="108" rx="2.5" fill="#1D4E89"/><text x="814" y="252" font-size="17" font-weight="600" fill="#101828">Activity</text><text x="814" y="276" font-size="14" fill="#5A6474">What has moved recently,</text><text x="814" y="294" font-size="14" fill="#5A6474">and what has gone quiet?</text><text x="814" y="321" font-size="13" fill="#5A6474" font-family="Consolas, 'Cascadia Mono', monospace">PASS / FAIL / UNKNOWN / STALE / ERROR / N-A</text><text x="24" y="371" font-size="14" fill="#5A6474">Every color is paired with a text label and a reason code, so the display survives grayscale printing and color vision deficiency.</text><text x="24" y="394" font-size="14" fill="#5A6474">The display is a projection of the record. The record remains canonical.</text></svg>