<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 380" width="1180" height="380" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" role="img" aria-labelledby="fig5-title fig5-desc"><title id="fig5-title">The seven-step repair pattern used in the case study</title><desc id="fig5-desc">The case-study repairs freeze bytes, state the claim, construct a minimal false pass, add a rejecting contract, pin a regression test, preserve the correction, and state the remaining limit.</desc><defs><marker id="fig5-ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1D4E89"/></marker><marker id="fig5-arm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5A6474"/></marker></defs><g transform="translate(20,18)"><text x="0" y="22" font-size="21" font-weight="600" fill="#101828">The repair pattern, which ends in a stated limit rather than a clean bill</text><text x="0" y="46" font-size="17" fill="#5A6474">Every correction in the case study followed these seven steps in this order.</text><line x1="0" y1="59" x2="1140" y2="59" stroke="#C9D0DA" stroke-width="1"/></g><rect x="24.0" y="98" width="148" height="104" rx="6" fill="#FFFFFF" stroke="#1D4E89" stroke-width="1.3"/><circle cx="48.0" cy="124" r="13" fill="#1D4E89"/><text x="48.0" y="129" font-size="14" font-weight="700" text-anchor="middle" fill="#FFFFFF">1</text><text x="70.0" y="129" font-size="16.5" font-weight="600" fill="#101828">Freeze</text><text x="38.0" y="158" font-size="13.5" fill="#5A6474">pin the exact</text><text x="38.0" y="176" font-size="13.5" fill="#5A6474">bytes under</text><text x="38.0" y="194" font-size="13.5" fill="#5A6474">review</text><path d="M172.0,150 L185.5,150" stroke="#1D4E89" stroke-width="1.3" marker-end="url(#fig5-ar)" fill="none"/><rect x="187.5" y="98" width="148" height="104" rx="6" fill="#FFFFFF" stroke="#1D4E89" stroke-width="1.3"/><circle cx="211.5" cy="124" r="13" fill="#1D4E89"/><text x="211.5" y="129" font-size="14" font-weight="700" text-anchor="middle" fill="#FFFFFF">2</text><text x="233.5" y="129" font-size="16.5" font-weight="600" fill="#101828">State</text><text x="201.5" y="158" font-size="13.5" fill="#5A6474">write the claim</text><text x="201.5" y="176" font-size="13.5" fill="#5A6474">being tested</text><path d="M335.5,150 L349.0,150" stroke="#1D4E89" stroke-width="1.3" marker-end="url(#fig5-ar)" fill="none"/><rect x="351.0" y="98" width="148" height="104" rx="6" fill="#FFFFFF" stroke="#1D4E89" stroke-width="1.3"/><circle cx="375.0" cy="124" r="13" fill="#1D4E89"/><text x="375.0" y="129" font-size="14" font-weight="700" text-anchor="middle" fill="#FFFFFF">3</text><text x="397.0" y="129" font-size="16.5" font-weight="600" fill="#101828">Break</text><text x="365.0" y="158" font-size="13.5" fill="#5A6474">build the</text><text x="365.0" y="176" font-size="13.5" fill="#5A6474">smallest false</text><text x="365.0" y="194" font-size="13.5" fill="#5A6474">pass</text><path d="M499.0,150 L512.5,150" stroke="#1D4E89" stroke-width="1.3" marker-end="url(#fig5-ar)" fill="none"/><rect x="514.5" y="98" width="148" height="104" rx="6" fill="#FFFFFF" stroke="#1D4E89" stroke-width="1.3"/><circle cx="538.5" cy="124" r="13" fill="#1D4E89"/><text x="538.5" y="129" font-size="14" font-weight="700" text-anchor="middle" fill="#FFFFFF">4</text><text x="560.5" y="129" font-size="16.5" font-weight="600" fill="#101828">Type</text><text x="528.5" y="158" font-size="13.5" fill="#5A6474">add a contract</text><text x="528.5" y="176" font-size="13.5" fill="#5A6474">that rejects it</text><path d="M662.5,150 L676.0,150" stroke="#1D4E89" stroke-width="1.3" marker-end="url(#fig5-ar)" fill="none"/><rect x="678.0" y="98" width="148" height="104" rx="6" fill="#FFFFFF" stroke="#1D4E89" stroke-width="1.3"/><circle cx="702.0" cy="124" r="13" fill="#1D4E89"/><text x="702.0" y="129" font-size="14" font-weight="700" text-anchor="middle" fill="#FFFFFF">5</text><text x="724.0" y="129" font-size="16.5" font-weight="600" fill="#101828">Pin</text><text x="692.0" y="158" font-size="13.5" fill="#5A6474">add a regression</text><text x="692.0" y="176" font-size="13.5" fill="#5A6474">or mutation test</text><path d="M826.0,150 L839.5,150" stroke="#1D4E89" stroke-width="1.3" marker-end="url(#fig5-ar)" fill="none"/><rect x="841.5" y="98" width="148" height="104" rx="6" fill="#FFFFFF" stroke="#1D4E89" stroke-width="1.3"/><circle cx="865.5" cy="124" r="13" fill="#1D4E89"/><text x="865.5" y="129" font-size="14" font-weight="700" text-anchor="middle" fill="#FFFFFF">6</text><text x="887.5" y="129" font-size="16.5" font-weight="600" fill="#101828">Keep</text><text x="855.5" y="158" font-size="13.5" fill="#5A6474">record the</text><text x="855.5" y="176" font-size="13.5" fill="#5A6474">correction,</text><text x="855.5" y="194" font-size="13.5" fill="#5A6474">delete nothing</text><path d="M989.5,150 L1003.0,150" stroke="#1D4E89" stroke-width="1.3" marker-end="url(#fig5-ar)" fill="none"/><rect x="1005.0" y="98" width="148" height="104" rx="6" fill="#F7EBD7" stroke="#9A5B0B" stroke-width="1.3"/><circle cx="1029.0" cy="124" r="13" fill="#9A5B0B"/><text x="1029.0" y="129" font-size="14" font-weight="700" text-anchor="middle" fill="#FFFFFF">7</text><text x="1051.0" y="129" font-size="16.5" font-weight="600" fill="#101828">Bound</text><text x="1019.0" y="158" font-size="13.5" fill="#5A6474">state what</text><text x="1019.0" y="176" font-size="13.5" fill="#5A6474">remains outside</text><text x="1019.0" y="194" font-size="13.5" fill="#5A6474">the check</text><path d="M1079.0,202 L1079.0,236 L98.0,236 L98.0,202" stroke="#5A6474" stroke-width="1.3" stroke-dasharray="4 4" marker-end="url(#fig5-arm)" fill="none"/><text x="590.0" y="260" font-size="14" text-anchor="middle" fill="#5A6474">the stated limit becomes the next claim to test</text><text x="24" y="312" font-size="14" fill="#5A6474">In these case-study corrections, the omitted step was the minimal false-pass test. A check that was never attacked has only been asserted.</text></svg>