<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 450" width="1180" height="450" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" role="img" aria-labelledby="fig3-title fig3-desc"><title id="fig3-title">Three stores with three retention rules</title><desc id="fig3-desc">The minimized event history follows an additions-only protocol rule. Detecting rewrites requires an authenticated current tip. Restricted raw evidence and the redacted public projection follow separate retention rules.</desc><defs><marker id="fig3-ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1D4E89"/></marker><marker id="fig3-arm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5A6474"/></marker></defs><g transform="translate(20,18)"><text x="0" y="22" font-size="21" font-weight="600" fill="#101828">Three stores, three retention rules</text><text x="0" y="46" font-size="17" fill="#5A6474">The event protocol permits additions only; rewrite detection requires an authenticated current tip.</text><line x1="0" y1="59" x2="1140" y2="59" stroke="#C9D0DA" stroke-width="1"/></g><rect x="24" y="98" width="360" height="246" rx="7" fill="#E3ECF6" stroke="#1D4E89" stroke-width="1.3"/><text x="46" y="133" font-size="18" font-weight="600" fill="#101828">Event history</text><text x="46" y="158" font-size="14" fill="#1D4E89" letter-spacing="0.7" font-weight="600">MINIMIZED</text><text x="46" y="191" font-size="15" fill="#101828">Typed status and commitments.</text><text x="46" y="219" font-size="15" fill="#101828">Protocol rule: additions only.</text><text x="46" y="247" font-size="15" fill="#101828">Rewrite detection requires an</text><text x="46" y="275" font-size="15" fill="#101828">authenticated current tip.</text><rect x="408" y="98" width="360" height="246" rx="7" fill="#F7EBD7" stroke="#9A5B0B" stroke-width="1.3"/><text x="430" y="133" font-size="18" font-weight="600" fill="#101828">Evidence store</text><text x="430" y="158" font-size="14" fill="#9A5B0B" letter-spacing="0.7" font-weight="600">RESTRICTED</text><text x="430" y="191" font-size="15" fill="#101828">The material a check actually read.</text><text x="430" y="219" font-size="15" fill="#101828">Access controlled. Retention bounded.</text><text x="430" y="247" font-size="15" fill="#101828">Deletable, and deletion is recorded.</text><rect x="792" y="98" width="360" height="246" rx="7" fill="#E1EFE7" stroke="#2C6E49" stroke-width="1.3"/><text x="814" y="133" font-size="18" font-weight="600" fill="#101828">Public projection</text><text x="814" y="158" font-size="14" fill="#2C6E49" letter-spacing="0.7" font-weight="600">REDACTED</text><text x="814" y="191" font-size="15" fill="#101828">Only what an owner released.</text><text x="814" y="219" font-size="15" fill="#101828">Rebuilt, not edited, on change.</text><text x="814" y="247" font-size="15" fill="#101828">Allowlisted bytes with digests.</text><text x="24" y="381" font-size="14" fill="#5A6474">An erasure record can remain in the event history after the restricted object is destroyed. Hashing a personal record does not anonymize it,</text><text x="24" y="404" font-size="14" fill="#5A6474">and a deletion receipt does not by itself establish legal compliance.</text></svg>