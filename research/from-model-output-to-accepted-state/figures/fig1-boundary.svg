<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 470" width="1180" height="470" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" role="img" aria-labelledby="fig1-title fig1-desc"><title id="fig1-title">The boundary around a probabilistic proposer</title><desc id="fig1-desc">A proposer supplies a candidate to a deterministic gate. The gate records stage receipts, replays an accepted projection, acts on the external world only through an authorized effect, and observes that world through a declared instrument.</desc><defs><marker id="fig1-ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1D4E89"/></marker><marker id="fig1-arm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5A6474"/></marker></defs><g transform="translate(20,14)"><text x="0" y="22" font-size="21" font-weight="600" fill="#101828">The boundary around a probabilistic proposer</text><text x="0" y="46" font-size="17" fill="#5A6474">The proposer suggests. A separate path decides, acts, observes, and accepts.</text><line x1="0" y1="59" x2="1140" y2="59" stroke="#C9D0DA" stroke-width="1"/></g><rect x="20" y="88" width="1140" height="74" rx="6" fill="#F4F6F9" stroke="#C9D0DA" stroke-width="1" stroke-dasharray="5 4"/><text x="40" y="114" font-size="16" font-weight="600" fill="#101828">External world</text><text x="40" y="138" font-size="14.5" fill="#5A6474">Partly hidden. Changing. Never read directly, only through a declared instrument that has its own limits.</text><path d="M400,206 L400,164" stroke="#5A6474" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#fig1-arm)" fill="none"/><text x="392" y="188" font-size="14" text-anchor="end" fill="#5A6474">authorized effect</text><path d="M760,164 L760,206" stroke="#5A6474" stroke-width="1.4" marker-end="url(#fig1-arm)" fill="none"/><text x="772" y="188" font-size="14" fill="#5A6474">qualified observation</text><rect x="20" y="208" width="1140" height="212" rx="8" fill="#FFFFFF" stroke="#1D4E89" stroke-width="1.6"/><text x="40" y="233" font-size="14" font-weight="600" fill="#1D4E89" letter-spacing="0.7">PROTOCOL BOUNDARY</text><rect x="316" y="244" width="800" height="104" rx="7" fill="#E3ECF6" stroke="#1D4E89" stroke-width="0.8" stroke-dasharray="3 3"/><text x="716" y="368" font-size="13.5" text-anchor="middle" fill="#1D4E89" letter-spacing="0.5">the tinted span is the whole of the determinism claim</text><rect x="44" y="256" width="200" height="80" rx="5" fill="#F4F6F9" stroke="#5A6474" stroke-width="1.2"/><text x="144.0" y="295.0" font-size="15.5" font-weight="600" text-anchor="middle" fill="#101828">Proposer</text><text x="144.0" y="311.0" font-size="13.5" text-anchor="middle" fill="#5A6474">model, person, or program</text><path d="M244,296 L306,296" stroke="#1D4E89" stroke-width="1.6" marker-end="url(#fig1-ar)" fill="none"/><text x="275" y="286" font-size="13" text-anchor="middle" fill="#5A6474">candidate</text><rect x="328" y="256" width="192" height="80" rx="5" fill="#E3ECF6" stroke="#1D4E89" stroke-width="1.2"/><text x="424.0" y="295.0" font-size="15.5" font-weight="600" text-anchor="middle" fill="#101828">Deterministic gate</text><text x="424.0" y="311.0" font-size="13.5" text-anchor="middle" fill="#5A6474">pinned policy and schemas</text><path d="M520,296 L582,296" stroke="#1D4E89" stroke-width="1.6" marker-end="url(#fig1-ar)" fill="none"/><rect x="586" y="256" width="204" height="80" rx="5" fill="#E3ECF6" stroke="#1D4E89" stroke-width="1.2"/><text x="688.0" y="295.0" font-size="15.5" font-weight="600" text-anchor="middle" fill="#101828">Append-only receipts</text><text x="688.0" y="311.0" font-size="13.5" text-anchor="middle" fill="#5A6474">one record per stage</text><path d="M790,296 L852,296" stroke="#1D4E89" stroke-width="1.6" marker-end="url(#fig1-ar)" fill="none"/><text x="821" y="286" font-size="13" text-anchor="middle" fill="#5A6474">replay</text><rect x="856" y="256" width="248" height="80" rx="5" fill="#E1EFE7" stroke="#2C6E49" stroke-width="1.2"/><text x="980.0" y="295.0" font-size="15.5" font-weight="600" text-anchor="middle" fill="#101828">Accepted projection</text><text x="980.0" y="311.0" font-size="13.5" text-anchor="middle" fill="#5A6474">a governance state</text><text x="40" y="402" font-size="14" fill="#5A6474">Pinned bytes in, projection out. The proposer that produced the candidate and the world the effect lands in both sit outside it.</text></svg>